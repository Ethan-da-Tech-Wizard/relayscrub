[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "relayscrub"
version = "1.0.0"
description = "Zero-Dependency, Offline Deterministic Privacy Scrubber & Untrusted LLM Content Fencing Framework for AI Agents."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
authors = [
    { name = "TWU LLC Systems Security Team", email = "security@twu.software" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/twullc/relayscrub"
Repository = "https://github.com/twullc/relayscrub.git"

[project.scripts]
relayscrub-scrub = "relayscrub.scrub:main"
relayscrub-inbound = "relayscrub.inbound:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["relayscrub*"]

[tool.setuptools.package-data]
relayscrub = ["data/*.json"]
