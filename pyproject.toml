[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "relayscrub"
version = "1.0.0"
description = "Experimental offline, stdlib-only scrubber for secrets and personal data in prompts, plus fencing for untrusted LLM replies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [
    { name = "Ethan-da-Tech-Wizard" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Ethan-da-Tech-Wizard/relayscrub"
Issues = "https://github.com/Ethan-da-Tech-Wizard/relayscrub/issues"
Repository = "https://github.com/Ethan-da-Tech-Wizard/relayscrub.git"

[project.scripts]
relayscrub-scrub = "relayscrub.scrub:main"
relayscrub-inbound = "relayscrub.inbound:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["relayscrub*"]

[tool.setuptools.package-data]
relayscrub = ["data/*.json"]
